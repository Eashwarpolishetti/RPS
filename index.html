<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ROCK-PAPER-SCISSOR</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <h1 id="head">Rock Paper Scissor</h1>
    <div class="choices">
        <div class="choice" id="paper">
            <img src="images/paper-cat.png">
        </div>
        <div class="choice" id="rock">
            <img src="images/rock-cat.png">
        </div>
        <div class="choice" id="scissor">
            <img src="images/scissors-cat.png">
        </div>
    </div>
    <div class="score-board">
        <div class="score">
            <p>You</p>
            <p id="user-score">0</p>
        </div>
        <div class="score">
            <p id="com-score">Computer</p>
            <p>0</p>
        </div>
    </div>
    <div class="msg-box">
        <p id="msg-cont"></p>
    </div>
    <script src="app.js"></script>
</body>
</html>
